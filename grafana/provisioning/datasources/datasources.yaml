apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        # Correlación Prometheus exemplar → Jaeger trace
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: "Ver traza en Jaeger"

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift:   "1m"
        customQuery: true
        query: '{service_name="${__span.process.serviceName}"} | trace_id="${__span.traceId}"'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToMetrics:
        datasourceUid: Prometheus
        tags: [{ key: "service.name", value: "service" }]
        queries:
          - name: "Request rate"
            query: "rate(http_requests_total{service=\"$__tags.service\"}[5m])"
      nodeGraph:
        enabled: true

  # Pilar de logs: Loki recibe los logs OTLP desde el Collector.
  # trace_id llega como structured metadata → enlace directo a la traza en Jaeger.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: "Ver traza en Jaeger"
