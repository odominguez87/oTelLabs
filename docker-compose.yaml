# ════════════════════════════════════════════════════════════════════════════
# docker-compose.yaml — Stack completo de observabilidad OTel local
#
# Iniciar: docker compose up -d
# Verificar: docker compose ps
# Teardown:  docker compose down -v
#
# Accesos:
#   FastAPI service-a:   http://localhost:8000/docs
#   FastAPI service-b:   http://localhost:8001/docs
#   Jaeger UI:           http://localhost:16686
#   Grafana:             http://localhost:3000 (admin/admin)
#   Prometheus:          http://localhost:9091
#   OTel Collector zpages: http://localhost:49410
# ════════════════════════════════════════════════════════════════════════════

networks:
  otel-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  jaeger-data:
  cloudsql-data:
  rds-data:
  alerts-data:

services:
  # ── Base de datos compartida ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER:     app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB:       appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── OTel Collector ───────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./otel-collector/collector-config.yaml:/etc/otel/collector-config.yaml:ro
      # Credenciales GCP (solo si se exporta a Cloud Logging; ruta del PC Windows original)
      # - //c/Users/ingod/AppData/Roaming/gcloud/application_default_credentials.json:/etc/gcloud/adc.json:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Métricas internas del Collector
      - "8889:8889"    # Prometheus endpoint (métricas de los servicios)
      - "13133:13133"  # Health check
      - "49410:55679"  # zPages (debug pipeline) -> http://localhost:49410
    environment:
      # GOOGLE_APPLICATION_CREDENTIALS: /etc/gcloud/adc.json
      # GCP_PROJECT_ID: cicdtraining-505323
      ENVIRONMENT: development
      CLOUD_REGION: us-central1
    networks:
      - otel-net
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Jaeger (backend de trazas) ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    user: "0"                          
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_SPAN_STORE_TTL: 12h        # acota el almacenamiento (Lab 4)
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP legacy
      - "4317"         # OTLP gRPC interno — solo el Collector lo usa
    networks:
      - otel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus (backend de métricas) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # Prometheus UI (9091 para no colisionar con apps)
    networks:
      - otel-net
    depends_on:
      - otel-collector

  # ── Grafana (visualización) ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      # Exportar paneles como PNG (evidencias del informe)
      GF_RENDERING_SERVER_URL:      http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL:    http://grafana:3000/
      # Solo laboratorio local: lectura anónima para renderizar paneles (no usar en producción)
      GF_AUTH_ANONYMOUS_ENABLED:    "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE:   Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - otel-net
    depends_on:
      - prometheus
      - jaeger

  # ── Tempo (alternativa de trazas para Grafana stack) ──────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo UI / API
      - "4317"        # OTLP gRPC interno
    networks:
      - otel-net

  # ── service-a ────────────────────────────────────────────────────────────
  service-a:
    build:
      context: ./service-a
      dockerfile: Dockerfile
    container_name: service-a
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SERVICE_B_URL:                http://service-b:8001
      DATABASE_URL:                 postgresql://app:secret@postgres:5432/appdb
      PROMETHEUS_PORT:              "9064"
      DATA_SERVICE_URL:             http://envoy-data:10000   # vía sidecar del mesh
      DATA_SERVICE_API_KEY:         svc-a-key
      OTEL_METRIC_EXPORT_INTERVAL:  "5000"
      ENVIRONMENT:                  development
      CLOUD_PROVIDER:               local
    ports:
      - "8000:8000"   # FastAPI
      - "9064:9064"   # Prometheus /metrics
    networks:
      - otel-net
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── service-b ────────────────────────────────────────────────────────────
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    container_name: service-b
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL:                 postgresql://app:secret@postgres:5432/appdb
      PROMETHEUS_PORT:              "9065"
      ENVIRONMENT:                  development
      CLOUD_PROVIDER:               local
    ports:
      - "8001:8001"   # FastAPI
      - "9065:9065"   # Prometheus /metrics (mapeado a 9092 en host)
    networks:
      - otel-net
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════
  # Lab 4 — Arquitectura observable completa
  # ════════════════════════════════════════════════════════════════════════

  # ── Bases de datos administradas (simuladas en local) ───────────────────
  # GCP Cloud SQL for PostgreSQL → infra/terraform/gcp/cloudsql.tf
  cloudsql-pg:
    image: postgres:16-alpine
    container_name: cloudsql-pg
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: secret, POSTGRES_DB: catalog }
    volumes:
      - cloudsql-data:/var/lib/postgresql/data
      - ./scripts/init-cloudsql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [otel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AWS RDS for PostgreSQL → infra/terraform/aws/rds.tf
  rds-pg:
    image: postgres:16-alpine
    container_name: rds-pg
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: secret, POSTGRES_DB: reviews }
    volumes:
      - rds-data:/var/lib/postgresql/data
      - ./scripts/init-rds.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [otel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reviews"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── data-service (3er microservicio) ────────────────────────────────────
  data-service:
    build: { context: ./data-service }
    container_name: data-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      CLOUDSQL_DSN: postgresql://app:secret@cloudsql-pg:5432/catalog
      RDS_DSN:      postgresql://app:secret@rds-pg:5432/reviews
      DATA_SERVICE_API_KEYS: svc-a-key
      DATA_SERVICE_ADMIN_KEY: chaos-admin-key
      ENVIRONMENT: development
    ports:
      - "8002:8002"   # expuesto SOLO para demostrar la alerta de bypass del mesh
    networks: [otel-net]
    depends_on:
      cloudsql-pg: { condition: service_healthy }
      rds-pg:      { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Service mesh: sidecar Envoy de data-service (observabilidad L7) ─────
  # Cloud Service Mesh / AWS App Mesh → infra/terraform/{gcp,aws}/mesh.tf
  envoy-data:
    image: envoyproxy/envoy:v1.31.2
    container_name: envoy-data
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-cluster", "data-service", "--log-level", "warn"]
    volumes:
      - ./mesh/envoy-data-service.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
      - "9901:9901"   # admin / métricas L7
    networks: [otel-net]
    depends_on: [data-service]

  # ── Pilar de logs: Loki ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    networks: [otel-net]

  # ── AIOps: Alertmanager + enriquecimiento con trace_id ──────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    networks: [otel-net]

  alert-enricher:
    image: python:3.12.7-slim
    container_name: alert-enricher
    command: ["python", "-u", "/tools/alert_enricher.py"]
    environment:
      JAEGER_URL: http://jaeger:16686
      ALERT_STORE: /data/alerts.jsonl
    volumes:
      - ./tools:/tools:ro
      - alerts-data:/data
    ports: ["8080:8080"]
    networks: [otel-net]

  # ── Seguridad: CVEs activos (reportes de Trivy) ─────────────────────────
  cve-exporter:
    image: python:3.12.7-slim
    container_name: cve-exporter
    command: ["python", "-u", "/tools/cve_exporter.py"]
    volumes:
      - ./tools:/tools:ro
      - ./security/reports:/reports:ro
    networks: [otel-net]

  # ── Renderizado de paneles de Grafana a PNG ─────────────────────────────
  grafana-renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: grafana-renderer
    networks: [otel-net]
